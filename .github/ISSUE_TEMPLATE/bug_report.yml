name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Please do not paste API keys, recordings or private texts.** For a security problem do not open an issue: see [SECURITY.md](https://github.com/ousttx/ahem/security/policy).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ahem version
      description: Settings → General → Version
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options: [macOS (Apple Silicon), macOS (Intel), Windows 11, Windows 10, Other]
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Speech model or service in use
      placeholder: e.g. Whisper Large v3 Turbo, or Groq
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Which app you were typing into, whether it happens every time, a screenshot.
