# Builds the installers for macOS (Apple silicon) and Windows when a version tag is pushed, and
# puts them, with the files the app's updater reads, in a draft release to check and publish.
# The updater's private key is the secret TAURI_SIGNING_PRIVATE_KEY (see docs/ARCHITECTURE.md).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci

      - name: Engines (macOS)
        if: matrix.name == 'macos'
        run: |
          tools/fetch-sherpa-onnx.sh
          tools/fetch-llama-cpp.sh
          tools/build-engine.sh
          tools/stage-engines.sh

      - name: Vulkan SDK (Windows)
        if: matrix.name == 'windows'
        run: choco install vulkan-sdk -y --no-progress

      - name: Engines (Windows)
        if: matrix.name == 'windows'
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\fetch-sherpa-onnx.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\fetch-llama-cpp.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\build-engine.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\stage-engines.ps1

      - name: Installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --config src-tauri/tauri.release.conf.json

      - name: Collect the files of the release
        shell: bash
        run: |
          mkdir release
          bundle=src-tauri/target/release/bundle
          if [ "${{ matrix.name }}" = macos ]; then
            cp "$bundle"/dmg/*.dmg "$bundle"/macos/*.app.tar.gz "$bundle"/macos/*.app.tar.gz.sig release/
          else
            cp "$bundle"/nsis/*-setup.exe "$bundle"/nsis/*-setup.exe.sig release/
          fi
          ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: release-*
          merge-multiple: true
      - name: The manifest of the updater
        run: node tools/update-manifest.mjs release "${GITHUB_REF_NAME#v}"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          # The signatures are inside latest.json; the .sig files are not published.
          gh release create "$GITHUB_REF_NAME" $(ls release/* | grep -v '\.sig$') --draft $prerelease --title "ahem ${GITHUB_REF_NAME#v}" --generate-notes
